name = "gallery"
version = "1.0.0"
gleam = ">= 1.19.2"
description = "Show pre-decoded PNG/GIF art on the AtomGL display"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
atomvm_gleam = { git = "https://github.com/nathanjohnson320/atomvm_gleam", ref = "85e06c186fd81bb77443608979706c6c28cc932e" }
atomgl_image = { path = "../atomgl_image" }
gleam_erlang = ">= 1.3.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
simplifile = ">= 2.0.0 and < 3.0.0"
orbital = { git = "https://github.com/nathanjohnson320/orbital", ref = "529f74320c837b28592c64f83cbb114e85cd62db" }
